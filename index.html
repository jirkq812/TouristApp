<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TourisMate – Komunitní průvodce městy</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col justify-between">

    <!-- Hlavička -->
    <header class="bg-blue-600 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-6 flex flex-col md:flex-row justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold tracking-tight">🌍 TourisMate</h1>
                <p class="text-blue-100 text-sm mt-1">Živý průvodce s tipy od cestovatelů</p>
            </div>
            <button onclick="openAddModal()" class="mt-4 md:mt-0 bg-white text-blue-600 font-semibold px-4 py-2 rounded-lg shadow hover:bg-blue-50 transition text-sm">
                + Přidat nové místo
            </button>
        </div>
    </header>

    <!-- Reklamní banner (Google AdSense) -->
    <div class="max-w-6xl mx-auto px-4 my-4 w-full">
        <div class="bg-gray-200 border border-dashed border-gray-400 p-2 text-center text-xs text-gray-500 rounded">
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
                 data-ad-slot="1234567890"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
            <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
            <span>[Reklamní prostor Google AdSense]</span>
        </div>
    </div>

    <!-- Hlavní obsah -->
    <main class="max-w-6xl mx-auto px-4 py-6 flex-grow w-full grid grid-cols-1 lg:grid-cols-4 gap-8">
        
        <!-- Boční panel: Filtry -->
        <aside class="lg:col-span-1 bg-white p-6 rounded-xl shadow-sm border border-gray-100 h-fit">
            <h2 class="text-lg font-semibold mb-4 text-gray-700">Filtrování míst</h2>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-600 mb-1">Město</label>
                <select id="cityFilter" onchange="filterAndRender()" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="all">Všechna města</option>
                    <option value="Pardubice">Pardubice</option>
                    <option value="Praha">Praha</option>
                    <option value="Brno">Brno</option>
                </select>
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-600 mb-1">Kategorie</label>
                <select id="categoryFilter" onchange="filterAndRender()" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="all">Všechny kategorie</option>
                    <option value="hotel">Hotely & Ubytování</option>
                    <option value="restaurant">Kavárny & Restaurace</option>
                    <option value="sight">Historické památky</option>
                </select>
            </div>
        </aside>

        <!-- Seznam míst -->
        <section class="lg:col-span-3">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-gray-800">Doporučená místa</h2>
                <span id="resultsCount" class="text-sm text-gray-500">Načítám z databáze...</span>
            </div>

            <div id="placesGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Dynamicky plněno z Firebase -->
            </div>
        </section>

    </main>

    <!-- Modální okno pro přidání místa -->
    <div id="addModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl max-w-lg w-full p-6 shadow-xl relative">
            <h3 class="text-xl font-bold mb-4 text-gray-800">Přidat nové turistické místo</h3>
            <form id="addPlaceForm" onsubmit="addNewPlace(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Název místa</label>
                    <input type="text" id="newTitle" required class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="např. Kavárna u Zámku">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Město</label>
                        <select id="newCity" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option value="Pardubice">Pardubice</option>
                            <option value="Praha">Praha</option>
                            <option value="Brno">Brno</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Kategorie</label>
                        <select id="newCategory" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option value="restaurant">Restaurace / Kavárna</option>
                            <option value="hotel">Hotel</option>
                            <option value="sight">Památka</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Popis místa</label>
                    <textarea id="newDesc" required rows="3" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Napište krátký popis..."></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">URL adresa fotky (např. Unsplash)</label>
                    <input type="url" id="newImage" required class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="https://images.unsplash.com/...">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Odkaz na Google Mapy (volitelné)</label>
                    <input type="url" id="newMapUrl" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="https://goo.gl/maps/...">
                </div>
                <div class="flex justify-end space-x-3 pt-2">
                    <button type="button" onclick="closeAddModal()" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-200">Zrušit</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700">Přidat do databáze</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Patička -->
    <footer class="bg-white border-t border-gray-200 mt-12 py-6 text-center text-sm text-gray-500">
        <p>&copy; 2026 TourisMate. Všechna práva vyhrazena. S podporou komunity a Booking.com affiliate.</p>
    </footer>

    <!-- Firebase a Logika aplikace -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ⚙️ SEM VLOŽ SVOJE FIREBASE CONFIG ÚDAJE Z KONZOLE
       const firebaseConfig = {
    apiKey: "AIzaSyAwf67q55t-rCran4hD1uXX5z8ENff1GU",
    authDomain: "touristapp-e242c.firebaseapp.com",
    projectId: "touristapp-e242c",
    storageBucket: "touristapp-e242c.appfirebasestorage.app",
    messagingSenderId: "490214550575",
    appId: "1:490214550575:web:0b86983f7d85f055d56ada"
};

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const affiliateId = "TVOJE_BOOKING_AID";

        let allPlaces = [];

        // Načítání dat v reálném čase z Firestore
        onSnapshot(collection(db, "places"), (snapshot) => {
            allPlaces = [];
            snapshot.forEach((doc) => {
                allPlaces.push({ id: doc.id, ...doc.data() });
            });
            filterAndRender();
        }, (error) => {
            console.error("Chyba při načítání dat z Firebase:", error);
            document.getElementById('resultsCount').innerText = "Chyba připojení k databázi (zkontroluj Firebase config).";
        });

        window.filterAndRender = function() {
            const city = document.getElementById('cityFilter').value;
            const category = document.getElementById('categoryFilter').value;

            let filtered = allPlaces;
            if (city !== 'all') filtered = filtered.filter(p => p.city === city);
            if (category !== 'all') filtered = filtered.filter(p => p.category === category);

            renderPlaces(filtered);
        };

        function renderPlaces(places) {
            const grid = document.getElementById('placesGrid');
            const count = document.getElementById('resultsCount');
            grid.innerHTML = '';
            count.innerText = `Nalezeno míst: ${places.length}`;

            if (places.length === 0) {
                grid.innerHTML = `<p class="text-gray-500 col-span-2 text-center py-8">Zatím zde nejsou žádná místa. Buď první a přidej nějaké!</p>`;
                return;
            }

            places.forEach(place => {
                let actionButton = '';
                if (place.category === 'hotel') {
                    const bookingLink = place.bookingUrl || `https://www.booking.com/searchresults.html?aid=${affiliateId}&ss=${encodeURIComponent(place.name + ' ' + place.city)}`;
                    actionButton = `<a href="${bookingLink}" target="_blank" rel="nofollow sponsored" class="block w-full text-center bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 rounded-lg text-sm transition mb-2">Rezervovat na Booking.com (Provize)</a>`;
                }

                const mapLink = place.mapUrl || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(place.name + ' ' + place.city)}`;
                
                // Vykreslení komentářů
                let commentsHtml = '';
                if (place.comments && place.comments.length > 0) {
                    commentsHtml = place.comments.map(c => `
                        <div class="bg-gray-50 p-2 rounded text-xs mb-1 border border-gray-100">
                            <span class="font-semibold text-blue-600">${c.author}</span>: ${c.text}
                        </div>
                    `).join('');
                } else {
                    commentsHtml = `<p class="text-xs text-gray-400 italic mb-2">Zatím žádné komentáře.</p>`;
                }

                grid.innerHTML += `
                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col justify-between">
                        <div>
                            <img src="${place.image}" alt="${place.name}" class="w-full h-48 object-cover">
                            <div class="p-5">
                                <div class="flex justify-between items-start mb-2">
                                    <h3 class="font-bold text-lg text-gray-800">${place.name}</h3>
                                    <span class="text-xs font-semibold px-2.5 py-1 bg-blue-50 text-blue-600 rounded-full">${place.city}</span>
                                </div>
                                <p class="text-gray-600 text-sm mb-4">${place.description}</p>
                                
                                <div class="mb-4">
                                    <h4 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Recenze a komentáře:</h4>
                                    <div class="max-h-28 overflow-y-auto mb-2">${commentsHtml}</div>
                                    <form onsubmit="addComment(event, '${place.id}')" class="flex gap-2">
                                        <input type="text" placeholder="Jméno" required class="w-1/3 border rounded p-1.5 text-xs">
                                        <input type="text" placeholder="Napiš komentář..." required class="w-2/3 border rounded p-1.5 text-xs">
                                        <button type="submit" class="bg-blue-600 text-white px-2.5 py-1.5 rounded text-xs hover:bg-blue-700">+</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                        <div class="p-5 pt-0 space-y-2">
                            ${actionButton}
                            <a href="${mapLink}" target="_blank" rel="noopener" class="block w-full text-center bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium py-2 rounded-lg text-sm transition">📍 Otevřít v Google Mapách</a>
                        </div>
                    </div>
                `;
            });
        }

        // Přidání nového místa do Firestore
        window.addNewPlace = async function(event) {
            event.preventDefault();
            const title = document.getElementById('newTitle').value;
            const city = document.getElementById('newCity').value;
            const category = document.getElementById('newCategory').value;
            const description = document.getElementById('newDesc').value;
            const image = document.getElementById('newImage').value;
            const mapUrl = document.getElementById('newMapUrl').value;

            try {
                await addDoc(collection(db, "places"), {
                    name: title,
                    city: city,
                    category: category,
                    description: description,
                    image: image,
                    mapUrl: mapUrl,
                    comments: []
                });
                closeAddModal();
                document.getElementById('addPlaceForm').reset();
                alert('Místo bylo úspěšně přidáno do cloudu!');
            } catch (e) {
                console.error("Chyba při ukládání:", e);
                alert('Nepodařilo se přidat místo. Zkontroluj konzoli.');
            }
        };

        // Přidání komentáře k místu
        window.addComment = async function(event, placeId) {
            event.preventDefault();
            const inputs = event.target.elements;
            const author = inputs[0].value;
            const text = inputs[1].value;

            const placeRef = doc(db, "places", placeId);
            // Pro zjednodušení v čistém JS pošleme aktualizované pole komentářů
            const targetPlace = allPlaces.find(p => p.id === placeId);
            const updatedComments = [...(targetPlace.comments || []), { author, text }];

            try {
                await updateDoc(placeRef, { comments: updatedComments });
                event.target.reset();
            } catch (e) {
                console.error("Chyba při odesílání komentáře:", e);
            }
        };

        window.openAddModal = () => document.getElementById('addModal').classList.remove('hidden');
        window.closeAddModal = () => document.getElementById('addModal').classList.add('hidden');
    </script>
</body>
</html>
